<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redcatch · Photo review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f2;color:#202a29;font:15px system-ui}header{background:#193831;color:white;padding:24px 4%}h1{margin:0;font-size:26px}header p{color:#c9d8d2}main{padding:24px 4%}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #b9c4be;border-radius:5px;background:white}button{cursor:pointer}button:hover{background:#dcebe4}button:disabled{opacity:.5;cursor:wait}nav,.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{background:white;padding:16px;border-radius:8px;min-width:130px}.stat strong{display:block;font-size:27px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:white;padding:14px;border:1px solid #dbe1dd;border-radius:8px}.card img{width:100%;height:220px;object-fit:contain;background:#e9ece8}.card h3{font-size:17px}.muted{color:#58675f;font-size:13px}.badge{padding:4px 8px;background:#eaf0d9;border-radius:5px}.status-approved{display:inline-block;padding:4px 10px;border:1px solid #27824c;border-radius:5px;background:#e3f5e9;color:#155c32;font-weight:600}label{display:block;margin:8px 0}textarea{width:100%;min-height:80px}.compare{display:flex;gap:10px}.compare img{width:49%;height:290px;object-fit:contain;background:#ddd}dialog{width:min(1000px,96vw);max-height:94vh;border:0;border-radius:12px}#message{position:sticky;top:0;background:#fff4c6;padding:12px;display:none;z-index:4}a{color:#245c4b}input[type=text]{max-width:100%}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

.project-section{margin:32px 0 44px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #cedbd3;padding-bottom:12px;margin-bottom:18px}.rename-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:12px 0}.rename-form[hidden]{display:none}.rename-form label{flex:1;min-width:200px}.rename-form input{width:100%}.move-group{width:100%;font-size:13px}.section-heading h2{margin:0 0 6px;font-size:21px}.section-heading p{margin:0}.final-grid{grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}.final-card{padding:10px}.final-card img{height:175px}.final-card.is-hero{border:2px solid #27824c;background:#f1faf4}.photo-open{display:block;width:100%;padding:0;border:0;background:transparent}.hero-choice{display:flex;align-items:center;gap:8px;font-weight:600;color:#155c32}.hero-choice input{width:18px;height:18px;accent-color:#27824c}.filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty-note{padding:18px;background:white;border-radius:6px}.section-count{font-size:14px;font-weight:400;color:#58675f}
</style><header><h1>Redcatch / Portfolio photo review</h1><p>Proposed groups, preserved originals, and a clear path to content development.</p></header><div id="message" role="status"></div><main><div id="stats" class="stats"></div><nav><button onclick="show('projects')">Finalised gallery</button><button onclick="show('homepage')">Homepage gallery</button><button onclick="show('unsuitable')">Unsuitable</button><button onclick="show('unassigned')">Unassigned</button><button onclick="show('all')">All photographs</button><button onclick="show('duplicates')">Duplicate review</button><button onclick="show('crops')">Crop review</button><button onclick="createProject()">+ New project</button><input id="search" placeholder="Search filename or project" oninput="render()"></nav><div id="content"></div></main><dialog id="detail"><button onclick="this.closest('dialog').close()">Close</button><div id="detailBody"></div></dialog>
<script>
let m,view='projects',current=null,thumbnailRevision=Date.now();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=p=>'/media/'+p.split('/').map(encodeURIComponent).join('/');const cats={'needs-review':'Needs review',domestic:'Domestic Scaffolding',commercial:'Commercial Scaffolding','temporary-roofs':'Temporary Roofs / False Roofs'};
const thumbnail=a=>media(a.thumbnail_path)+'?v='+thumbnailRevision;
async function refresh(){m=await(await fetch('/api/manifest')).json();thumbnailRevision=Date.now();render()}
function msg(s){$('message').textContent=s;$('message').style.display='block'}
async function edit(data){document.querySelectorAll('button,input,select,textarea').forEach(b=>b.disabled=true);msg('Saving changes and updating image copies…');try{let r=await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error);await refresh();msg('Saved to the manifest.');if(current)openProject(current);return j}catch(e){msg(e.message)}finally{document.querySelectorAll('button,input,select,textarea').forEach(b=>b.disabled=false);if($('downloadHomepage'))$('downloadHomepage').disabled=!Object.values(m.assets).some(a=>a.homepage_selected&&retained(a))}}
function show(v){view=v;current=null;render()}
function options(selected,unassigned=true){return (unassigned?'<option value="">Unassigned</option>':'')+Object.values(m.projects).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.id+' · '+p.title)}</option>`).join('')}
function imageCard(a){if(a.error)return `<article class="card">${esc(a.original_filename)}<p>${esc(a.error)}</p></article>`;return `<article class="card"><label><input type="checkbox" class="pick" value="${a.id}"> Select for split</label><img loading="lazy" src="${thumbnail(a)}"><p>${esc(a.original_filename)}</p>${homepageChoice(a)}<p class="muted">${a.processed_dimensions.join(' × ')} · ${esc(a.project_id||'Unassigned')} · ${esc(a.duplicate_status)} · ${esc(a.review_status)}</p><p class="muted">${a.quality_observations.map(esc).join('<br>')}</p><select aria-label="Move image" onchange="edit({op:'move',asset:'${a.id}',destination:this.value})">${options(a.project_id)}</select><div class="bar"><button onclick="inspect('${a.id}')">Inspect / crop / duplicates</button><button onclick="edit({op:'image',asset:'${a.id}',status:'${a.review_status==='unsuitable'?'pending':'unsuitable'}'})">${a.review_status==='unsuitable'?'Restore':'Unsuitable'}</button>${a.project_id?`<button onclick="edit({op:'hero',project:'${a.project_id}',asset:'${a.id}'})">Use as hero</button>`:''}</div></article>`}
function render(){let all=Object.values(m.assets),ps=Object.values(m.projects);$('stats').innerHTML=[['Source images',all.length],['Unique file contents',new Set(all.map(a=>a.source_hash)).size],['Project groups',ps.length],['Exact duplicates',all.filter(a=>a.duplicate_status==='exact').length],['Pending review',all.filter(a=>a.review_status==='pending').length],['Homepage selected',all.filter(a=>a.homepage_selected&&retained(a)).length],['Pending crops',all.filter(a=>a.crop?.decision==='pending').length]].map(([k,v])=>`<div class="stat"><strong>${v}</strong>${k}</div>`).join('');let q=$('search').value.toLowerCase();if(current&&m.projects[current])return renderProject(current);if(view==='projects'){renderFinalGallery(q);return}if(view==='homepage'){renderHomepage(q);return}let filtered=all.filter(a=>(view!=='unsuitable'||a.review_status==='unsuitable')&&(view!=='unassigned'||!a.project_id)&&(view!=='duplicates'||a.duplicate_status==='exact'||a.duplicate_candidates?.length)&&(view!=='crops'||a.crop?.applied)&&(a.original_filename+' '+a.project_id).toLowerCase().includes(q));$('content').innerHTML=`<h2>${esc(view)} · ${filtered.length}</h2><div class="grid">${filtered.map(a=>view==='unsuitable'?finalPhotoCard(a,m.projects[a.project_id]):imageCard(a)).join('')}</div>`}
function retained(a){return !a.error&&a.review_status!=='unsuitable'&&a.duplicate_status!=='exact'&&a.duplicate_decision!=='duplicate'}
function matchesSearch(a,q){const p=m.projects[a.project_id];return [a.original_filename,a.project_id,p?.title,p?.category_name].join(' ').toLowerCase().includes(q)}
function finalPhotoCard(a,p){const unsuitable=a.review_status==='unsuitable';const hero=!!p&&p.hero===a.id;return `<article class="card final-card ${hero&&!unsuitable?'is-hero':''}"><button class="photo-open" onclick="inspect('${a.id}')" aria-label="Inspect ${esc(a.original_filename)}"><img loading="lazy" src="${thumbnail(a)}" alt="${esc(a.original_filename)}"></button><p class="muted filename" title="${esc(a.original_filename)}">${esc(a.original_filename)}</p>${homepageChoice(a)}${p&&!unsuitable?`<label class="hero-choice"><input type="checkbox" ${hero?'checked':''} aria-label="Use ${esc(a.original_filename)} as hero for ${esc(p.id)}" onchange="chooseHero('${p.id}','${a.id}',this)"> Hero image</label>`:''}${unsuitable?`<p class="muted">${esc(p?p.id+' · '+p.title:'Unassigned')}</p>`:''}<label class="muted">Move to group<select class="move-group" aria-label="Move ${esc(a.original_filename)} to group" onchange="moveImage('${a.id}',this.value)">${options(a.project_id)}</select></label><div class="bar"><button onclick="inspect('${a.id}')">Inspect</button><button onclick="edit({op:'image',asset:'${a.id}',status:'${unsuitable?'pending':'unsuitable'}'})">${unsuitable?'Restore':'Unsuitable'}</button></div></article>`}
function homepageChoice(a){if(!retained(a))return '';return `<label class="hero-choice"><input type="checkbox" ${a.homepage_selected?'checked':''} onchange="selectHomepage('${a.id}',this.checked)"> Homepage gallery</label>`}
async function selectHomepage(asset,selected){const result=await edit({op:'homepage',asset,selected});if(!result)render()}
function renderHomepage(q){const photos=Object.values(m.assets).filter(a=>a.homepage_selected&&retained(a));const visible=photos.filter(a=>matchesSearch(a,q));$('content').innerHTML=`<div class="section-heading"><div><h2>Homepage gallery <span class="section-count">${photos.length} selected photos</span></h2><p class="muted">A separate shortlist. Your photos stay in their project groups.</p></div><button id="downloadHomepage" ${photos.length?'':'disabled'} onclick="downloadHomepage()">Download selected photos (ZIP)</button></div><p>Choose photos using the Homepage gallery checkbox in any group. Unzip the download, then upload the JPG files together to Squarespace.</p>${visible.length?`<div class="grid final-grid">${visible.map(a=>finalPhotoCard(a,m.projects[a.project_id])).join('')}</div>`:'<p class="empty-note">No selected photos to show. Choose your favourites from the Finalised gallery.</p>'}`}
async function downloadHomepage(){const button=$('downloadHomepage');button.disabled=true;msg('Preparing your selected homepage images…');try{const response=await fetch('/api/homepage-export.zip');if(!response.ok){const data=await response.json();throw Error(data.error)}const url=URL.createObjectURL(await response.blob());const link=document.createElement('a');link.href=url;link.download='redcatch-homepage-gallery.zip';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);msg('Download ready. Unzip it and upload the JPG files to Squarespace.')}catch(e){msg(e.message)}finally{button.disabled=false}}
async function chooseHero(project,asset,checkbox){if(!checkbox.checked){checkbox.checked=true;return}const result=await edit({op:'hero',project,asset});if(!result)render()}
function renderFinalGallery(q){const all=Object.values(m.assets);let html='';for(const p of Object.values(m.projects)){const members=all.filter(a=>a.project_id===p.id);const photos=members.filter(a=>retained(a)&&matchesSearch(a,q));if(q&&!photos.length)continue;html+=`<section class="project-section" id="section-${p.id}"><div class="section-heading"><div><h2>${esc(p.title)} <span class="section-count">${photos.length} photos</span></h2><p class="muted">${esc(p.id)} · ${esc(p.category_name)} · <span class="${['approved','ready'].includes(p.review_status)?'status-approved':''}">${esc(p.review_status)}</span></p></div><div class="bar"><button onclick="renameProject('${p.id}')">Rename group</button><button onclick="openProject('${p.id}')">Edit group</button></div></div><form class="rename-form" id="rename-form-${p.id}" hidden onsubmit="event.preventDefault();saveRename('${p.id}')"><label>Group name<input id="rename-title-${p.id}" value="${esc(p.title)}" required maxlength="200" oninput="this.setCustomValidity('')"></label><button type="submit">Save name</button><button type="button" onclick="cancelRename('${p.id}')">Cancel</button></form>${photos.length?`<div class="grid final-grid">${photos.map(a=>finalPhotoCard(a,p)).join('')}</div>`:'<p class="empty-note">No retained photos yet. Use a photo’s Move to group dropdown to add it here. Excluded photographs remain available in Unsuitable and Duplicate review.</p>'}</section>`}
const unassigned=all.filter(a=>!a.project_id&&retained(a)&&matchesSearch(a,q));if(unassigned.length)html+=`<section class="project-section"><div class="section-heading"><h2>Unassigned <span class="section-count">${unassigned.length} photos</span></h2><button onclick="show('unassigned')">Organise photos</button></div><div class="grid final-grid">${unassigned.map(a=>finalPhotoCard(a,null)).join('')}</div></section>`;
const unsuitable=all.filter(a=>a.review_status==='unsuitable'&&matchesSearch(a,q));html+=`<section class="project-section" id="unsuitable"><div class="section-heading"><div><h2>Unsuitable <span class="section-count">${unsuitable.length} photos</span></h2><p class="muted">Excluded from the portfolio. Restore any photo to its original group.</p></div></div><div class="grid final-grid">${unsuitable.map(a=>finalPhotoCard(a,m.projects[a.project_id])).join('')}</div></section>`;$('content').innerHTML=html}
function renameProject(id){const form=$('rename-form-'+id),input=$('rename-title-'+id);form.hidden=false;input.value=m.projects[id].title;input.setCustomValidity('');input.focus();input.select();}
function cancelRename(id){$('rename-form-'+id).hidden=true;}
async function saveRename(id){const input=$('rename-title-'+id);const title=input.value.trim();input.setCustomValidity(title?'':'Enter a group name');if(!input.reportValidity())return;await edit({op:'rename-project',project:id,title});}
async function moveImage(id,destination){const result=await edit({op:'move',asset:id,destination});if(!result)render();}
async function saveProject(id){const result=await edit({op:'project',project:id,category:$('category').value,status:$('status').value,title:$('title').value,tags:$('tags').value,description:$('description').value});if(!result&&m.projects[id])$('status').value=m.projects[id].review_status;}
function openProject(id){current=id;if(!m.projects[id]){current=null;render();return}renderProject(id)}
function renderProject(id){let p=m.projects[id];$('content').innerHTML=`<button onclick="current=null;render()">← Back</button><h2>${esc(id)}</h2><p class="badge">${esc(p.grouping_confidence)} grouping confidence</p><p>${esc(p.evidence)}</p><div class="fields"><label>Working title <input id="title" value="${esc(p.title)}"></label><label>Primary category <select id="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${k===p.primary_category?'selected':''}>${v}</option>`).join('')}</select></label><label>Secondary service tags <input id="tags" value="${esc(p.secondary_categories.join(', '))}"></label><label>Status <select id="status" onchange="saveProject('${id}')">${['pending','approved','ready'].map(v=>`<option ${v===p.review_status?'selected':''}>${v}</option>`).join('')}</select></label></div><label>Factual visual description<textarea id="description">${esc(p.description)}</textarea></label><button onclick="saveProject('${id}')">Save project / approval</button><p class="muted">Status saves automatically. Approved confirms this group belongs together. Review pending crops before marking Ready for content development.</p><details><summary>Preliminary content assessment</summary><p>${esc(p.content_assessment.demonstrates)}</p><p>${esc(p.content_assessment.potential_relevance)}</p><p>Hero: ${esc(p.hero)}. ${esc(p.content_assessment.repetitive_images)}</p><ul>${p.content_assessment.information_needed.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details><div class="bar"><select id="mergeTarget">${options(null,false)}</select><button onclick="if(confirm('Merge this group into the selected project?'))edit({op:'merge',project:'${id}',destination:$('mergeTarget').value})">Merge into selected group</button><button onclick="edit({op:'split',project:'${id}',assets:[...document.querySelectorAll('.pick:checked')].map(e=>e.value)})">Split selected into new project</button></div><div class="grid">${p.asset_ids.map(i=>imageCard(m.assets[i])).join('')}</div>`}
async function createProject(){let title=prompt('Provisional project title');if(title){let r=await edit({op:'create',title});if(r)openProject(r.project)}}
function inspect(id){let a=m.assets[id];$('detailBody').innerHTML=`<h2>${esc(a.original_filename)}</h2><p>Original / current clean master</p><div class="compare"><img src="/original/${id}"><img src="${media(a.cleaned_path)}?t=${Date.now()}"></div><label>Manual crop [left, top, right, bottom] <input id="manualBox" value="${a.crop.box.join(',')}"></label><button onclick="edit({op:'crop',asset:'${id}',decision:'approved',box:$('manualBox').value.split(',').map(Number)}).then(()=>inspect('${id}'))">Save manual crop</button><p>Crop coordinates [left, top, right, bottom]: ${a.crop.box.join(', ')}. Confidence: ${a.crop.confidence}. Decision: ${a.crop.decision}.</p><p class="muted">${esc(a.crop.evidence.join('; '))}. Inspect for interface elements and meaningful dark content.</p>${a.crop.applied?`<div class="bar"><button onclick="edit({op:'crop',asset:'${id}',decision:'approved'}).then(()=>inspect('${id}'))">Approve crop</button><button onclick="edit({op:'crop',asset:'${id}',decision:'rejected'}).then(()=>inspect('${id}'))">Reject / restore full image</button><button onclick="edit({op:'crop',asset:'${id}',decision:'pending'}).then(()=>inspect('${id}'))">Reset crop proposal</button></div>`:''}<button onclick="edit({op:'image',asset:'${id}',status:'approved'}).then(()=>inspect('${id}'))">Approve photograph</button><p>Duplicate status: ${a.duplicate_status}. Preferred version: ${esc(a.preferred_version)}. Decision: ${esc(a.duplicate_decision||'pending')}</p><div class="grid">${a.duplicate_candidates.map(c=>{let b=m.assets[c.id];return `<div class="card"><img src="${thumbnail(b)}"><p>${esc(b.original_filename)} · ${b.processed_dimensions.join(' × ')} · ${esc(c.method||'hash match')} · hash distance ${c.distance}</p><button onclick="edit({op:'duplicate',asset:'${id}',decision:'duplicate',preferred:'${b.id}'}).then(()=>inspect('${id}'))">Mark current image redundant; retain this candidate</button></div>`}).join('')}</div><button onclick="edit({op:'duplicate',asset:'${id}',decision:'distinct'}).then(()=>inspect('${id}'))">Keep current image as distinct</button><p class="muted">Near matches are suggestions only. Different angles and stages should remain distinct.</p>`;if(!$('detail').open)$('detail').showModal()}
refresh().catch(e=>msg(e.message));
</script></html>
